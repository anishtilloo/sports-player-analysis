spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

jwt.access_token_secret=test_access_secret_key_for_unit_tests_only_32ch
jwt.refresh_token_secret=test_refresh_secret_key_for_unit_tests_only_32ch
jwt.access_token_expiration=86400000
jwt.refresh_token_expiration=2629800000
